# =============================================================================
# ABTC Search Configuration
# =============================================================================
# Version: 1.2.1
# 
# This file defines the search grid parameters for ABTC's threshold optimization.
# Two optimization paths are supported:
#   - Path A: Metric-driven joint (α, τ) optimization
#   - Path B: Cost-sensitive α optimization with analytical τ*
# =============================================================================

# -----------------------------------------------------------------------------
# Search Architecture
# -----------------------------------------------------------------------------
search:
  architecture: "single-layer"
  version: "1.2.1"
  description: >
    ABTC uses a single-layer grid search for optimal parameter selection.
    This replaces the previous two-layer (coarse + fine-grained) approach.

# -----------------------------------------------------------------------------
# Path A: Metric-Driven Optimization
# -----------------------------------------------------------------------------
# Use this path when optimizing for metrics like F1, F2, G-Mean, MCC, etc.
# Joint grid search over (α, τ) parameter space.
#
# Total evaluations: n_alpha × n_tau = 27 × 20 = 540
# -----------------------------------------------------------------------------
path_a:
  name: "Metric-Driven"
  description: "Joint (α, τ) grid search for metric optimization"
  
  # Alpha (α) parameter: Posterior adjustment strength
  alpha:
    n_values: 27
    min: 0.1
    max: 3.0
    delta: 0.1074  # ≈ (3.0 - 0.1) / 26
    description: >
      α controls the prior adjustment: logit(p_adj) = logit(p) + α·log((1-π)/π).
      α = 0 leaves p unchanged; α = 1 gives the equal-prior posterior; for a minority
      positive class (π < 0.5) a larger α predicts the positive class more often.
      Each (α, τ) pair equals one threshold on p: t = σ(logit τ − α·log((1-π)/π)).
  
  # Tau (τ) parameter: Decision threshold
  tau:
    n_values: 20
    min: 0.01
    max: 0.99
    delta: 0.0516  # ≈ (0.99 - 0.01) / 19
    description: >
      τ is the decision threshold applied to adjusted posteriors.
      Predictions: ŷ = 1 if p_adj ≥ τ, else 0
  
  # Total evaluations
  total_evaluations: 540  # 27 × 20
  
  # Supported metrics for Path A
  supported_metrics:
    - F1
    - F2
    - G-Mean
    - MCC
    - BalancedAcc

# -----------------------------------------------------------------------------
# Path B: Cost-Sensitive Optimization
# -----------------------------------------------------------------------------
# Use this path when optimizing for misclassification cost.
# τ* is calculated analytically; only α is searched.
#
# Total evaluations: n_alpha = 27
# -----------------------------------------------------------------------------
path_b:
  name: "Cost-Sensitive"
  description: "α search with analytical τ* from cost ratio"
  
  # Alpha (α) parameter: Same grid as Path A
  alpha:
    n_values: 27
    min: 0.1
    max: 3.0
    delta: 0.1074
  
  # Tau (τ) parameter: Calculated analytically
  tau:
    method: "analytical"
    formula: "τ* = C_FP / (C_FP + C_FN)"
    description: >
      For cost-sensitive optimization, the optimal threshold is derived
      analytically from the cost ratio, eliminating the need for τ search.
  
  # Total evaluations
  total_evaluations: 27
  
  # Default cost configuration
  default_costs:
    cost_fp: 1.0   # Cost of False Positive
    cost_fn: 10.0  # Cost of False Negative
    cost_ratio: 10.0  # C_FN / C_FP

# -----------------------------------------------------------------------------
# Grid Resolution Summary
# -----------------------------------------------------------------------------
grid_resolution:
  alpha:
    range: "[0.1, 3.0]"
    n_points: 27
    step_size: "Δα ≈ 0.11"
  tau:
    range: "[0.01, 0.99]"
    n_points: 20
    step_size: "Δτ ≈ 0.05"

# -----------------------------------------------------------------------------
# Calibration Settings
# -----------------------------------------------------------------------------
calibration:
  method: "isotonic"
  alternatives:
    - "isotonic"    # Isotonic regression (recommended)
    - "sigmoid"     # Platt scaling
  cv_folds: 3       # Inner CV folds for calibration
  description: >
    Isotonic calibration is applied before posterior adjustment.
    Uses 3-fold cross-validation within the training split.

# -----------------------------------------------------------------------------
# Computational Complexity
# -----------------------------------------------------------------------------
complexity:
  path_a:
    evaluations: "O(n_alpha × n_tau)"
    default: "27 × 20 = 540"
    time_estimate: >
      Measured on 20 datasets (Supplementary Table S10): median 5.5 s per fold for the
      original loop (540 scikit-learn metric calls), 8 ms per fold for the vectorised
      implementation (joint_alpha_tau_search_fast) with the same 540 candidates.
  path_b:
    evaluations: "O(n_alpha)"
    default: "27"
    time_estimate: "27 metric evaluations per fold"

# -----------------------------------------------------------------------------
# Experiment Settings
# -----------------------------------------------------------------------------
experiment:
  random_state: 42
  cv_folds: 10          # Outer K-fold CV
  bootstrap_iterations: 1000  # For confidence intervals
  
# -----------------------------------------------------------------------------
# Version History
# -----------------------------------------------------------------------------
version_history:
  - version: "1.2.0"
    date: "2026-10"
    changes:
      - "Documentation of α corrected (α = 0 is no adjustment; larger α raises minority probabilities)"
      - "effective_threshold() and vectorised joint_alpha_tau_search_fast() added"
      - "Ablation, leakage-sensitivity code and results added (manuscript revision)"
  - version: "1.0.0"
    changes:
      - "Single-layer grid search: 27α × 20τ for Path A, 27α for Path B with analytical τ*"
